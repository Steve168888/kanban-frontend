<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Kanban</title>
</head>
<body class="bg-light">

<div class="container-fluid vh-100 d-flex flex-column">

    <div class="py-4 px-4 border-bottom flex-shrink-0">
        <div class="d-flex justify-content-between align-items-center">
			<h4 id="projectName" class="mb-0">Nama Project</h4>
		</div>
    </div>

    <div class="flex-grow-1 overflow-auto px-4 py-4">
		<div class="mb-3">
			<div class="d-flex justify-content-end">
				<button id="btnCreateKanban" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createKanbanModal">+ Create Kanban</button>
			</div>

            <div class="row g-4 mt-1" id="kanbanContainer">
                <!-- Kolom kanban akan muncul di sini -->
                
            </div>
		</div>
	</div>

    <!-- MODAL CREATE KANBAN -->
	<div class="modal fade" id="createKanbanModal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-sm modal-dialog-centered">
			<div class="modal-content">

				<div class="modal-header">
					<h6 id="createKanbanTitle" class="modal-title">Create Kanban</h6>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>

				<div class="modal-body">
					<div class="mb-3">
						<label class="form-label">Kanban Name</label>
						<input  id="kanbanName" type="text" class="form-control" placeholder="To do"/>
						<small id="kanbanError" class="text-danger"></small>
					</div>
				</div>

				<div class="modal-footer d-flex justify-content-between">
					<button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
					<button id="btnSubmitCreateKanban" type="button" class="btn btn-primary">Create</button>
				</div>

			</div>
		</div>
	</div>

</div>


<script src="kanban.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
